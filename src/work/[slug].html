<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Velmont Design Studio — project detail." />
    <title>Project — Velmont Design Studio</title>

    <link rel="canonical" href="https://velmontdesign.com/work/PROJECT_SLUG" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4f0eb" />

    <meta property="og:site_name" content="Velmont Design Studio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Project — Velmont Design Studio" />
    <meta property="og:description" content="Velmont Design Studio — project detail." />
    <meta property="og:url" content="https://velmontdesign.com/work/PROJECT_SLUG" />
    <meta property="og:image" content="https://velmontdesign.com/assets/og/default-og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Project — Velmont Design Studio" />
    <meta name="twitter:description" content="Velmont Design Studio — project detail." />
    <meta name="twitter:image" content="https://velmontdesign.com/assets/og/default-og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>

    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/nav.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/project.css" />
  </head>
  <body>
    <a class="vm-skip-link" href="#main">Skip to content</a>
    <div id="nav-mount" data-component="nav"></div>

    <main id="main" data-project-state="loading" aria-busy="true">
      <!-- Breadcrumb -->
      <nav class="vm-breadcrumb" aria-label="Breadcrumb">
        <a class="vm-breadcrumb__item" href="/work">Work</a>
        <span class="vm-breadcrumb__sep" aria-hidden="true">/</span>
        <a class="vm-breadcrumb__item" href="/work" data-breadcrumb-discipline>Discipline</a>
        <span class="vm-breadcrumb__sep" aria-hidden="true">/</span>
        <span
          class="vm-breadcrumb__item vm-breadcrumb__item--current"
          aria-current="page"
          data-breadcrumb-project
          >Project</span
        >
      </nav>

      <!-- Project hero -->
      <section class="vm-proj-hero" aria-labelledby="proj-h">
        <picture>
          <source type="image/avif" data-proj-hero-avif />
          <img
            class="vm-proj-hero__bg"
            data-proj-hero-img
            src=""
            alt=""
            width="1440"
            height="520"
            loading="eager"
          />
        </picture>
        <p class="vm-proj-hero__eyebrow" data-proj-eyebrow>Discipline · Location</p>
        <h1 id="proj-h" class="vm-proj-hero__h1" data-proj-h1>Project Name</h1>
      </section>

      <!-- Spec bar -->
      <div class="vm-spec-bar" aria-label="Project specifications">
        <div class="vm-spec-bar__cell">
          <span class="vm-spec-bar__label">Industry</span>
          <span class="vm-spec-bar__value" data-spec-industry>—</span>
        </div>
        <div class="vm-spec-bar__cell">
          <span class="vm-spec-bar__label">Area</span>
          <span class="vm-spec-bar__value" data-spec-area>—</span>
        </div>
        <div class="vm-spec-bar__cell">
          <span class="vm-spec-bar__label">Year</span>
          <span class="vm-spec-bar__value" data-spec-year>—</span>
        </div>
        <div class="vm-spec-bar__cell">
          <span class="vm-spec-bar__label">Scope</span>
          <span class="vm-spec-bar__value" data-spec-scope>—</span>
        </div>
      </div>

      <!-- Project body -->
      <div class="vm-proj-body">
        <p class="vm-proj-body__lead" data-proj-lead></p>
        <div class="vm-proj-body__right">
          <div data-proj-body></div>
          <div class="vm-proj-body__materials" data-proj-materials></div>
        </div>
      </div>

      <!-- Image gallery — up to 5 images; JS sets data-count for CSS layout -->
      <div class="vm-proj-gallery" aria-label="Project gallery">
        <picture>
          <source type="image/avif" data-gallery-avif="0" />
          <img
            class="vm-proj-gallery__img"
            data-gallery-img="0"
            src=""
            alt=""
            loading="lazy"
            width="820"
            height="520"
          />
        </picture>
        <picture>
          <source type="image/avif" data-gallery-avif="1" />
          <img
            class="vm-proj-gallery__img"
            data-gallery-img="1"
            src=""
            alt=""
            loading="lazy"
            width="380"
            height="256"
          />
        </picture>
        <picture>
          <source type="image/avif" data-gallery-avif="2" />
          <img
            class="vm-proj-gallery__img"
            data-gallery-img="2"
            src=""
            alt=""
            loading="lazy"
            width="380"
            height="256"
          />
        </picture>
        <picture>
          <source type="image/avif" data-gallery-avif="3" />
          <img
            class="vm-proj-gallery__img"
            data-gallery-img="3"
            src=""
            alt=""
            loading="lazy"
            width="820"
            height="260"
          />
        </picture>
        <picture>
          <source type="image/avif" data-gallery-avif="4" />
          <img
            class="vm-proj-gallery__img"
            data-gallery-img="4"
            src=""
            alt=""
            loading="lazy"
            width="380"
            height="260"
          />
        </picture>
      </div>

      <!-- Lightbox — opened when a gallery image is clicked -->
      <div
        class="vm-lightbox"
        id="vm-lightbox"
        role="dialog"
        aria-modal="true"
        aria-label="Image viewer"
        hidden
      >
        <button class="vm-lightbox__close" aria-label="Close">&#215;</button>
        <button class="vm-lightbox__prev" aria-label="Previous image">&#8249;</button>
        <img class="vm-lightbox__img" src="" alt="" />
        <button class="vm-lightbox__next" aria-label="Next image">&#8250;</button>
      </div>

      <!-- Prev / Next project navigation -->
      <nav class="vm-proj-nav" aria-label="Project navigation">
        <a class="vm-proj-nav__btn vm-proj-nav__btn--prev" data-proj-nav-prev href="#" hidden>
          <span class="vm-proj-nav__arrow" aria-hidden="true">←</span>
          <span class="vm-proj-nav__meta">
            <span class="vm-proj-nav__label">Previous</span>
            <span class="vm-proj-nav__title" data-proj-nav-prev-title></span>
          </span>
        </a>
        <a class="vm-proj-nav__btn vm-proj-nav__btn--next" data-proj-nav-next href="#" hidden>
          <span class="vm-proj-nav__meta">
            <span class="vm-proj-nav__label">Next</span>
            <span class="vm-proj-nav__title" data-proj-nav-next-title></span>
          </span>
          <span class="vm-proj-nav__arrow" aria-hidden="true">→</span>
        </a>
      </nav>

      <!-- Other Projects -->
      <section class="vm-other-projects" aria-labelledby="other-proj-h">
        <header class="vm-other-projects__hd">
          <p class="vm-kicker" id="other-proj-h">Other Projects</p>
          <a class="vm-link" href="/work">View All <span aria-hidden="true">→</span></a>
        </header>
        <div class="vm-other-projects__grid" data-other-projects>
          <!-- Hydrated by project.js -->
        </div>
      </section>
    </main>

    <div id="footer-mount" data-component="footer"></div>

    <script type="module">
      import { injectComponent, markActiveNavLink, initMobileNav } from '../js/components.js';
      import { initProject } from '../js/project.js';

      async function init() {
        await Promise.all([
          injectComponent('#nav-mount', '/components/nav.html'),
          injectComponent('#footer-mount', '/components/footer.html'),
        ]);
        markActiveNavLink();
        initMobileNav();
        initProject();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
